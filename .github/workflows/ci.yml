name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every push to main runs to the end: its group
# is its commit, so a later merge neither cancels it nor replaces it while it waits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each action is pinned to a commit, with its version in a comment. A tag can move to other code,
# and a commit cannot. Dependabot moves the pins, see .github/dependabot.yml.
#
# No job draws pixels. The runners have no GPU, so the pixel check runs on a machine of a person:
# pnpm check:render.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        # lint rules, formatting and import order. Annotates the PR diff.
        run: pnpm exec biome ci --reporter=github --reporter=default .

      - name: Writing style
        # plain ASCII punctuation, no filler words, short sentences in the docs
        run: pnpm lint:prose

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Source rules
        # layer imports, file size, casts
        run: pnpm check:source

      - name: Fixture cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/.cache
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Test with coverage
        # downloads missing fixtures first, then runs unit tests and the parity suite
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Generated facts are current
        # reads the numbers of the docs from the source and the build, so it runs after the build
        run: pnpm check:facts

      - name: Public API snapshot
        run: pnpm check:api

      - name: Publish contents
        run: pnpm check:publish-contents

      - name: Bundle size
        run: pnpm size:check

      - name: Dead code
        run: pnpm check:dead

  site:
    # The docs site is the one real bundle in the repo: it imports the built package as a game does.
    # A change that breaks its types or its build fails here, before the deploy finds it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build library
        # the site reads the types and the code of the built package
        run: pnpm build

      - name: Typecheck the site
        run: pnpm typecheck
        working-directory: apps/site

      - name: Build the site
        run: pnpm site:build
