name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every push to main runs to the end: its group
# is its commit, so a later merge neither cancels it nor replaces it while it waits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        # lint rules, formatting and import order. Annotates the PR diff.
        run: pnpm exec biome ci --reporter=github --reporter=default .

      - name: Writing style
        # plain ASCII punctuation, no filler words, short sentences in the docs
        run: pnpm lint:prose

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Source rules
        # layer imports, file size, casts
        run: pnpm check:source

      - name: Generated facts are current
        run: pnpm check:facts

      - name: Fixture cache
        uses: actions/cache@v6
        with:
          path: fixtures/.cache
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Test with coverage
        # downloads missing fixtures first, then runs unit tests and the parity suite
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Public API snapshot
        run: pnpm check:api

      - name: Publish contents
        run: pnpm check:publish-contents

      - name: Bundle size
        run: pnpm size:check

      - name: Dead code
        run: pnpm check:dead

  pixi-floor:
    # The peer range starts at pixi.js 8.21.0 and pixi-silk 1.0.1, but the dev dependencies resolve
    # newer versions. This job installs the lowest ones into the package on the runner, where the
    # changed manifest and lockfile stay, and runs the typecheck and the unit tests on them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the lowest peers
        # the floors are the starts of the peer ranges in packages/pixi-marrow/package.json
        run: |
          pnpm --filter pixi-marrow add --save-dev $(node scripts/peer-floor.mjs)
          node scripts/peer-floor.mjs --check

      - name: Fixture cache
        uses: actions/cache@v6
        with:
          path: fixtures/.cache
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # downloads missing fixtures first, then runs unit tests and the parity suite
        run: pnpm test

  changeset-gate:
    # Library source changed but no changeset added. Escape hatch: the `skip-changeset` label.
    if: >-
      github.event_name == 'pull_request'
      && !contains(github.event.pull_request.labels.*.name, 'skip-changeset')
      && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a changeset for library changes
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base" "$head" -- 'packages/pixi-marrow/src/**' 'packages/pixi-marrow/package.json' | grep -q .; then
            # In a git pathspec `*` matches `/` too, so `.changeset/*.md` would count a file added
            # to .changeset/pre/. The glob form matches the top folder only.
            added=$(git diff --name-only --no-renames --diff-filter=A "$base" "$head" -- ':(glob).changeset/*.md' | grep -vE '(^|/)README\.md$' || true)
            # A release in pre mode moves the changesets from .changeset/ into .changeset/pre/. Only
            # such a move counts, not a file that is added to .changeset/pre/ alone.
            moved=""
            for file in $(git diff --name-only --no-renames --diff-filter=D "$base" "$head" -- ':(glob).changeset/*.md'); do
              if git diff --name-only --no-renames --diff-filter=A "$base" "$head" -- ".changeset/pre/${file#.changeset/}" | grep -q .; then
                moved="$moved $file"
              fi
            done
            if [ -z "$added" ] && [ -z "$moved" ]; then
              echo "::error::This PR changes packages/pixi-marrow but adds no .changeset/*.md. Run 'pnpm changeset' or add the 'skip-changeset' label."
              exit 1
            fi
          fi
