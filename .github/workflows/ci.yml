name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Every push to main runs to the end: its group
# is its commit, so a later merge neither cancels it nor replaces it while it waits.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each action is pinned to a commit, with its version in a comment. A tag can move to other code,
# and a commit cannot. Dependabot moves the pins, see .github/dependabot.yml.
#
# No job draws pixels. The runners have no GPU, so the pixel check runs on a machine of a person:
# pnpm check:render.

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint and format (Biome)
        # lint rules, formatting and import order. Annotates the PR diff.
        run: pnpm exec biome ci --reporter=github --reporter=default .

      - name: Writing style
        # plain ASCII punctuation, no filler words, short sentences in the docs
        run: pnpm lint:prose

      - name: Commit message lint
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Typecheck
        run: pnpm typecheck

      - name: Source rules
        # layer imports, file size, casts
        run: pnpm check:source

      - name: Fixture cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/.cache
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Test with coverage
        # downloads missing fixtures first, then runs unit tests and the parity suite
        run: pnpm test:coverage

      - name: Build library
        run: pnpm build

      - name: Generated facts are current
        # reads the numbers of the docs from the source and the build, so it runs after the build
        run: pnpm check:facts

      - name: Public API snapshot
        run: pnpm check:api

      - name: Publish contents
        run: pnpm check:publish-contents

      - name: Bundle size
        run: pnpm size:check

      - name: Dead code
        run: pnpm check:dead

  node-floor:
    # The job `ci` runs on the newest Node. `engines` of the root package.json starts lower, and the
    # command line tool and the entries for Node must run there. This job runs the unit tests, the
    # tool and those entries on that lowest Node.
    #
    # The build runs on the newest Node first. tsdown reads its config in TypeScript, which Node
    # does without help only from 22.18 on. A user of the package never builds it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm build

      - name: Change to the lowest Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # the start of `engines.node` in the root package.json. The next step fails when they differ
          node-version: 22.12.0

      - name: This Node is the floor of engines
        run: |
          node -e "
            const range = require('./package.json').engines.node;
            const floor = /^>=(\d+\.\d+)(?:\.0)?$/.exec(range)?.[1];
            const here = process.versions.node.split('.').slice(0, 2).join('.');
            console.log('engines.node is ' + range + ', this Node is ' + process.versions.node);
            if (floor !== here) {
              console.error('Set node-version of the job node-floor in .github/workflows/ci.yml to the start of engines.node.');
              process.exit(1);
            }
          "

      - name: Fixture cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/.cache
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Unit tests
        # downloads missing fixtures first, then runs unit tests and the parity suite
        run: pnpm test

      - name: Command line tool
        # the tool starts from the built package and reads a skeleton that is in the repository
        run: node packages/pixi-marrow/bin/pixi-marrow.mjs info fixtures/bzzz/animation_coin.skel

      - name: Entries for Node
        # the entries that run without Pixi load from the built package and export something
        run: |
          node --input-type=module -e "
            for (const entry of ['core', 'optimize', 'bake']) {
              const module = await import('./packages/pixi-marrow/dist/' + entry + '.js');
              const count = Object.keys(module).length;
              console.log('pixi-marrow/' + entry + ': ' + count + ' exports');
              if (count === 0) process.exit(1);
            }
          "

  pixi-floor:
    # The peer range starts at pixi.js 8.21.0 and pixi-silk 1.0.1, but the dev dependencies resolve
    # newer versions. This job installs the lowest ones into the package on the runner, where the
    # changed manifest and lockfile stay, and runs the typecheck and the unit tests on them.
    #
    # The tests run in Node, where a canvas has no context. So no test uploads a texture, which is
    # what differs on 8.21. Only the pixel check does: pnpm check:render --pixi=8.21.0, on a
    # machine with a GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the lowest peers
        # The floors are the starts of the peer ranges in packages/pixi-marrow/package.json. The
        # check fails when a peer is not at its floor, and when the install added a package that
        # the committed lockfile does not pin. So the job runs on pinned packages only.
        run: |
          pnpm --filter pixi-marrow add --save-dev $(node scripts/peer-floor.mjs)
          node scripts/peer-floor.mjs --check

      - name: Fixture cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fixtures/.cache
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Typecheck
        # With skipLibCheck, as everywhere. Without it tsc reports the types of the peers
        # themselves: pixi.js 8.21.0 and pixi-silk 1.0.1 each have one error under
        # exactOptionalPropertyTypes, which is not for this repository to fix.
        run: pnpm typecheck

      - name: Unit tests
        # downloads missing fixtures first, then runs unit tests and the parity suite
        run: pnpm test

  site:
    # The docs site is the one real bundle in the repo: it imports the built package as a game does.
    # A change that breaks its types or its build fails here, before the deploy finds it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build library
        # the site reads the types and the code of the built package
        run: pnpm build

      - name: Typecheck the site
        run: pnpm typecheck
        working-directory: apps/site

      - name: Build the site
        run: pnpm site:build
